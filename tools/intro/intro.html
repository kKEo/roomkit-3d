<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>RoomKit 3D — intro (render source)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@300;400;600&family=VT323&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; background: #000; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c" width="1280" height="720"></canvas>
<video id="v" src="out/footage.webm" muted playsinline preload="auto" style="display:none"></video>
<script>
/**
 * The intro film, drawn on a canvas as a pure function of time, so render.mjs can step through it
 * frame by frame: `await seek(t)` draws the frame at `t` seconds. Open it in a browser with
 * `?play` to watch it in real time instead. The footage (out/footage.webm) comes from footage.mjs.
 */
const W = 1280, H = 720, FPS = 30;
const C = { bg: '#000000', accent: '#00ff66', ink: '#001a0a', hi: '#b8ffcc', text: '#bff7cf', dim: '#5fa877', panel: 'rgba(0,16,7,.74)' };
const DISPLAY = '"VT323", "IBM Plex Mono", monospace', BODY = '"IBM Plex Mono", monospace';
const GLYPHS = 'ｱｲｳｴｵｶｷｸｹｺｻｼｽｾｿﾀﾁﾂﾃﾄﾅﾆﾇﾈﾉﾊﾋﾌﾍﾎﾏﾐﾑﾒﾓ0123456789<>/=+*#';

// ---- timeline -------------------------------------------------------------------------------
const FOOT_IN = 7.4, FOOT_OUT = 43.4, SPEED = 1.25;     // the slice of the footage, and how fast it plays
const T = { title: 0, desc: 4.6, foot: 9.2 };
T.features = T.foot + (FOOT_OUT - FOOT_IN) / SPEED;
T.end = T.features + 4.4;
const DURATION = T.end + 3.6;
const FOOTAGE_SILENT_BEFORE = 0.5;    // the few seconds of loader at the start of the footage are skipped

// captions over the footage: [footage time, text]
const CAPTIONS = [
  [7.4, 'The camera flies in. Every visit starts on the big screen.'],
  [9.0, 'Click any screen to zoom in. Esc steps back.'],
  [14.3, 'A stop places objects and opens a panel: frames, benches, screens…'],
  [18.8, 'Nine kinds of screen. Graphs, tables and consoles fed live from a URL.'],
  [23.6, 'One hatch shader draws it all. No lights, no post-processing.'],
  [27.6, 'An in-browser editor with live preview. Download the folder, ship it.'],
  [31.6, 'Objects take click actions: these doors lead to other rooms.'],
  [35.6, 'Press 0 for the whole hall, roof off.'],
  [40.2, 'Scenes are JSON and Markdown. Ship content, not code.'],
];
const FEATURES = [
  ['JSON scenes', 'one folder per room'],
  ['10+ object types', 'or ship your own as a module'],
  ['9 screen sources', 'video, rain, graphs, forms…'],
  ['Live feeds', 'polled JSON or SSE streams'],
  ['Any floor plan', 'from a footprint polygon'],
  ['Editor built in', 'edit, preview, download'],
];

// ---- helpers --------------------------------------------------------------------------------
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const easeOut = x => 1 - Math.pow(1 - clamp(x), 4);
const easeInOut = x => { x = clamp(x); return x < .5 ? 16 * x ** 5 : 1 - Math.pow(-2 * x + 2, 5) / 2; };
const hash = (a, b, c = 0) => { let h = (a * 374761393 + b * 668265263 + c * 2246822519) >>> 0; h = Math.imul(h ^ (h >>> 13), 1274126177); return ((h ^ (h >>> 16)) >>> 0) / 4294967296; };
const glyph = (a, b, c) => GLYPHS[Math.floor(hash(a, b, c) * GLYPHS.length)];

const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const video = document.getElementById('v');

function rain(t, alpha, cols = 64, speedMul = 1) {
  const cw = W / cols, fs = cw * 0.9;
  ctx.save();
  ctx.globalAlpha = alpha;
  ctx.font = `${fs}px ${BODY}`;
  ctx.textAlign = 'center';
  for (let i = 0; i < cols; i++) {
    const speed = (4 + hash(i, 1) * 9) * speedMul, len = 8 + Math.floor(hash(i, 2) * 14);
    const head = ((t * speed + hash(i, 3) * 60) % (60 + len)) - len;
    for (let k = 0; k < len; k++) {
      const row = Math.floor(head) - k;
      if (row < 0 || row * fs > H) continue;
      const f = 1 - k / len;
      ctx.fillStyle = k === 0 ? C.hi : C.accent;
      ctx.globalAlpha = alpha * (k === 0 ? 1 : f * f * 0.75);
      ctx.fillText(glyph(i, row, Math.floor(t * 6 + hash(i, row))), i * cw + cw / 2, row * fs);
    }
  }
  ctx.restore();
}

function scanlines(light = false) {
  ctx.save();
  ctx.fillStyle = light ? 'rgba(0,0,0,.1)' : 'rgba(0,0,0,.22)';
  for (let y = 0; y < H; y += 3) ctx.fillRect(0, y, W, 1);
  if (!light) {
    const g = ctx.createRadialGradient(W / 2, H / 2, H * 0.35, W / 2, H / 2, H * 0.95);
    g.addColorStop(0, 'rgba(0,0,0,0)'); g.addColorStop(1, 'rgba(0,0,0,.62)');
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  }
  ctx.restore();
}

/** A scan band sweeping down the frame at the start of each section. */
function wipe(local) {
  if (local > 0.55) return;
  const y = easeOut(local / 0.55) * (H + 80) - 40;
  const g = ctx.createLinearGradient(0, y - 40, 0, y + 40);
  g.addColorStop(0, 'rgba(0,255,102,0)'); g.addColorStop(0.5, 'rgba(184,255,204,.55)'); g.addColorStop(1, 'rgba(0,255,102,0)');
  ctx.fillStyle = g; ctx.fillRect(0, y - 40, W, 80);
  ctx.fillStyle = 'rgba(0,0,0,.9)'; ctx.fillRect(0, y + 40, W, H);
}

/** Text that resolves out of glyph noise: `p` 0…1 reveals from the left. */
function scramble(text, x, y, p, font, color, align = 'left', seed = 0) {
  ctx.save();
  ctx.font = font; ctx.textAlign = align; ctx.textBaseline = 'alphabetic';
  const n = text.length, shown = Math.floor(p * (n + 6));
  let out = '';
  for (let i = 0; i < n; i++) {
    if (text[i] === ' ') { out += ' '; continue; }
    if (i < shown - 6) out += text[i];
    else if (i < shown) out += glyph(seed + i, shown, 0);
    else out += ' ';
  }
  ctx.fillStyle = color;
  ctx.shadowColor = color; ctx.shadowBlur = 18;
  ctx.fillText(out, x, y);
  ctx.shadowBlur = 0;
  ctx.fillText(out, x, y);
  ctx.restore();
}

/** Typed text with a cursor; `chars` is how many characters are in by now. */
function typed(text, x, y, chars, font, color, cursor = true) {
  ctx.save();
  ctx.font = font; ctx.textAlign = 'left'; ctx.fillStyle = color;
  const s = text.slice(0, Math.max(0, Math.floor(chars)));
  ctx.fillText(s, x, y);
  if (cursor && chars < text.length + 4 && Math.floor(chars * 2) % 2 === 0) {
    const w = ctx.measureText(s).width;
    ctx.fillStyle = C.accent; ctx.fillRect(x + w + 4, y - parseInt(font) * 0.8, parseInt(font) * 0.55, parseInt(font) * 0.95);
  }
  ctx.restore();
}

function frame(x, y, w, h, color = C.accent, lw = 2) {
  ctx.save();
  ctx.strokeStyle = color; ctx.lineWidth = lw; ctx.strokeRect(x + .5, y + .5, w, h);
  const c = 18;
  ctx.lineWidth = lw + 2;
  for (const [cx, cy, dx, dy] of [[x, y, 1, 1], [x + w, y, -1, 1], [x, y + h, 1, -1], [x + w, y + h, -1, -1]]) {
    ctx.beginPath(); ctx.moveTo(cx, cy + dy * c); ctx.lineTo(cx, cy); ctx.lineTo(cx + dx * c, cy); ctx.stroke();
  }
  ctx.restore();
}

function kicker(text, x, y) {
  ctx.save();
  ctx.font = `20px ${BODY}`; ctx.fillStyle = C.dim; ctx.textAlign = 'left';
  ctx.fillText(text, x, y);
  const w = ctx.measureText(text).width;
  ctx.strokeStyle = 'rgba(0,255,102,.35)'; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(x + w + 16, y - 7); ctx.lineTo(W - 80, y - 7); ctx.stroke();
  ctx.restore();
}

// ---- sections -------------------------------------------------------------------------------
function title(t) {
  rain(t, 0.9 * clamp(1 - (t - 1.5) / 2) + 0.14, 64, 1);
  const p = easeOut((t - 0.4) / 1.9);
  if (t > 0.4) scramble('RoomKit 3D', W / 2, 352, p, `190px ${DISPLAY}`, C.hi, 'center', 7);
  if (t > 1.9) typed('walkable 3D rooms from configuration files', 320, 420, (t - 1.9) * 28, `30px ${BODY}`, C.text);
  if (t > 3.2) { ctx.save(); ctx.globalAlpha = easeOut((t - 3.2) / 0.8); kicker('an intro // 45 s', 80, 100); ctx.restore(); }
  frame(60, 60, W - 120, H - 120, 'rgba(0,255,102,.5)', 1);
}

function desc(t) {
  rain(t + 40, 0.12, 64, 0.6);
  kicker('what it is', 80, 100);
  const lines = [
    ['A room is a folder.', C.hi, `64px ${DISPLAY}`, 0.2],
    ['scene.json describes the hall, one small JSON file per stop,', C.text, `28px ${BODY}`, 1.1],
    ['Markdown for the panels, pictures and video in media/.', C.text, `28px ${BODY}`, 2.0],
    ['Drop the folder into scenes/ and it is live. No build step.', C.accent, `28px ${BODY}`, 3.0],
  ];
  let y = 250;
  for (const [text, color, font, at] of lines) {
    if (t > at) typed(text, 120, y, (t - at) * 40, font, color, false);
    y += font.startsWith('64') ? 90 : 56;
  }
  // a little folder tree at the right
  const tree = ['scenes/cinema/', '  scene.json', '  poi/01-welcome.json', '  content/welcome.md', '  media/intro.mp4', '  data/showtimes.json', '  prefabs/seats.js'];
  ctx.save(); ctx.font = `22px ${BODY}`; ctx.textAlign = 'left';
  tree.forEach((l, i) => { if (t > 1.2 + i * 0.22) { ctx.fillStyle = i ? C.dim : C.accent; ctx.fillText(l, 880, 520 + i * 28); } });
  ctx.restore();
  frame(840, 480, 380, 220, 'rgba(0,255,102,.45)', 1);
}

function footage(t) {
  const ft = FOOT_IN + t * SPEED;
  // the film, letterboxed in a frame
  const fx = 80, fy = 14, fw = W - 160, fh = fw * 9 / 16;
  ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, H);
  if (video.readyState >= 2) ctx.drawImage(video, fx, fy, fw, fh);
  frame(fx, fy, fw, fh, 'rgba(0,255,102,.6)', 1);
  // caption bar
  let cap = CAPTIONS[0][1], capAt = 0;
  for (const [at, text] of CAPTIONS) if (ft >= at) { cap = text; capAt = at; }
  const age = (ft - capAt) / SPEED;
  ctx.save();
  ctx.globalAlpha = easeOut(age / 0.35);
  ctx.fillStyle = C.panel; ctx.fillRect(fx, H - 76, fw, 50);
  ctx.strokeStyle = 'rgba(0,255,102,.5)'; ctx.strokeRect(fx + .5, H - 75.5, fw, 50);
  ctx.fillStyle = C.accent; ctx.fillRect(fx, H - 76, 6, 50);
  ctx.font = `24px ${BODY}`; ctx.fillStyle = C.text; ctx.textAlign = 'left';
  ctx.fillText(cap, fx + 24, H - 43);
  ctx.font = `20px ${BODY}`; ctx.fillStyle = C.dim; ctx.textAlign = 'right';
  ctx.fillText(`${String(CAPTIONS.findIndex(c => c[0] === capAt) + 1).padStart(2, '0')} / ${String(CAPTIONS.length).padStart(2, '0')}`, fx + fw - 20, H - 43);
  ctx.restore();
}

function features(t) {
  rain(t + 90, 0.12, 64, 0.6);
  kicker('what you get', 80, 100);
  scramble('Everything in the box', 120, 190, easeOut(t / 1.2), `72px ${DISPLAY}`, C.hi, 'left', 3);
  const cw = 370, ch = 150, gap = 25, x0 = 80, y0 = 250;
  FEATURES.forEach(([head, sub], i) => {
    const at = 0.6 + i * 0.28, p = easeOut((t - at) / 0.6);
    if (t < at) return;
    const x = x0 + (i % 3) * (cw + gap), y = y0 + Math.floor(i / 3) * (ch + gap) + (1 - p) * 30;
    ctx.save(); ctx.globalAlpha = p;
    ctx.fillStyle = C.panel; ctx.fillRect(x, y, cw, ch);
    frame(x, y, cw, ch, 'rgba(0,255,102,.6)', 1);
    ctx.font = `38px ${DISPLAY}`; ctx.fillStyle = C.accent; ctx.textAlign = 'left'; ctx.fillText(head, x + 22, y + 60);
    ctx.font = `20px ${BODY}`; ctx.fillStyle = C.text; ctx.fillText(sub, x + 22, y + 100);
    ctx.restore();
  });
}

function end(t) {
  rain(t + 130, 0.5 * easeOut(t / 1.5) + 0.1, 64, 1.2);
  scramble('RoomKit 3D', W / 2, 330, easeOut(t / 1.3), `150px ${DISPLAY}`, C.hi, 'center', 11);
  if (t > 1.0) typed('walk in: 1–6 for the stops, 0 for the hall, W A S D to fly', 220, 400, (t - 1.0) * 34, `28px ${BODY}`, C.text, false);
  if (t > 2.2) {
    ctx.save(); ctx.globalAlpha = easeOut((t - 2.2) / 0.6);
    ctx.font = `22px ${BODY}`; ctx.fillStyle = C.dim; ctx.textAlign = 'center';
    ctx.fillText('open the editor · read the guide · try ?scene=gallery and ?scene=loft', W / 2, 470);
    ctx.restore();
  }
  frame(60, 60, W - 120, H - 120, 'rgba(0,255,102,.5)', 1);
  // fade to black at the very end, so the loop joins cleanly
  ctx.fillStyle = `rgba(0,0,0,${clamp((t - 3.0) / 0.6)})`; ctx.fillRect(0, 0, W, H);
}

function draw(t) {
  ctx.fillStyle = C.bg; ctx.fillRect(0, 0, W, H);
  let section, local;
  if (t < T.desc) { section = title; local = t - T.title; }
  else if (t < T.foot) { section = desc; local = t - T.desc; }
  else if (t < T.features) { section = footage; local = t - T.foot; }
  else if (t < T.end) { section = features; local = t - T.features; }
  else { section = end; local = t - T.end; }
  section(local);
  scanlines(section === footage);
  if (section !== title) wipe(local);
  // the first frames fade in from black
  ctx.fillStyle = `rgba(0,0,0,${clamp(1 - t / 0.6)})`; ctx.fillRect(0, 0, W, H);
}

/** Draw the frame at `t` seconds: seeks the footage first when it is on screen. Returns when drawn. */
async function seek(t) {
  if (t >= T.foot && t < T.features) {
    const ft = FOOT_IN + (t - T.foot) * SPEED;
    if (Math.abs(video.currentTime - ft) > 1 / (FPS * 4)) {
      await new Promise(res => { video.addEventListener('seeked', res, { once: true }); video.currentTime = ft; });
    }
  }
  draw(t);
}
window.seek = seek; window.DURATION = DURATION; window.FPS = FPS;

window.ready = (async () => {
  await document.fonts.load(`20px ${DISPLAY}`); await document.fonts.load(`20px ${BODY}`); await document.fonts.load(`600 20px ${BODY}`);
  await new Promise(res => video.readyState >= 1 ? res() : video.addEventListener('loadedmetadata', res, { once: true }));
  return true;
})();

if (location.search.includes('play')) {
  window.ready.then(() => {
    const t0 = performance.now();
    (function loop() { const t = ((performance.now() - t0) / 1000) % DURATION; seek(t).then(() => requestAnimationFrame(loop)); })();
  });
}
</script>
</body>
</html>
